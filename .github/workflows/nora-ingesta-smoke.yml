name: NORA - Smoke Test Ingesta

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install earthengine-api pandas numpy supabase
      - name: Prueba 3 meses 2024
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT_ID: nora-506511
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NORA_REGION_ID: alto_xingu
          NORA_START_YEAR: "2024"
          NORA_END_YEAR: "2024"
          NORA_START_MONTH: "1"
          NORA_END_MONTH: "3"
          NORA_PROFILE: full
        run: python ingesta_sistema_ampliado.py
      - name: Verificar variables nuevas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          sb=create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          rows=sb.table('nora_ingesta_alto_xingu').select('cloud_fraction,evapotranspiration_mm,runoff_mm,soil_moisture_rootzone,vpd_kpa').gte('year',2024).lte('month',3).limit(10).execute().data or []
          print('Filas de comprobación:', len(rows))
          print(rows[:3])
          PY
