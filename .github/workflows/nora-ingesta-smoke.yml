name: NORA - Smoke Test Ingesta

on:
  push:
    paths:
      - "ingesta_sistema_ampliado.py"
      - ".github/workflows/nora-ingesta-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install earthengine-api pandas numpy supabase

      - name: Smoke test Earth Engine + Supabase
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT_ID: nora-506511
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NORA_REGION_ID: alto_xingu
          NORA_START_YEAR: 2024
          NORA_END_YEAR: 2024
          NORA_PROFILE: core
        run: |
          python -m py_compile ingesta_sistema_ampliado.py
          python ingesta_sistema_ampliado.py
