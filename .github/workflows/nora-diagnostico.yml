name: NORA - Diagnóstico

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Diagnóstico de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Probar runner
        env:
          TEST_SECRET: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "GitHub Actions OK"
          test -n "$TEST_SECRET"
          echo "Secret disponible"
