name: NORA - Earth Engine real data

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  id-token: write

env:
  PYTHONPATH: src

jobs:
  earth-engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate NORA source
        run: python -m compileall -q src scripts
      - name: Verify NORA package import
        run: python -c "from nora_engine.earth_engine import config_desde_entorno, extraer; print('NORA package import: OK')"
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Verify configuration
        env:
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: test -n "$EE_PROJECT"
      - name: Run real-data smoke test
        env:
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: python scripts/prueba_earth_engine.py
