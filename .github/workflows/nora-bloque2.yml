name: Bloque 2 - Fuego y Agua Alto Xingu

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nora-alto-xingu-ingest
  cancel-in-progress: false

jobs:
  bloque2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install earthengine-api pandas numpy supabase

      - name: Verificar credencial Earth Engine
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          python - <<'PY'
          import json, os
          key = os.environ.get("GEE_SERVICE_ACCOUNT_KEY")
          if not key:
              raise SystemExit("Falta GEE_SERVICE_ACCOUNT_KEY: no se permite autenticación interactiva en automatización.")
          data = json.loads(key)
          for field in ("client_email", "private_key", "project_id"):
              if not data.get(field):
                  raise SystemExit(f"Credencial GEE inválida: falta {field}.")
          print("Credencial Earth Engine: estructura válida")
          PY

      - name: Ejecutar bloque 2 (fuego + agua)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python bloque2_fuego_agua.py
