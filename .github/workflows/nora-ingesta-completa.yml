name: Ingesta Completa Alto Xingu

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: nora-ingesta-alto-xingu
  cancel-in-progress: false

jobs:
  ingesta_completa:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install earthengine-api pandas numpy supabase

      - name: Verificar credencial Earth Engine
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          python - <<'PY'
          import json, os
          key = os.environ.get("GEE_SERVICE_ACCOUNT_KEY")
          if not key:
              raise SystemExit("Falta GEE_SERVICE_ACCOUNT_KEY: no se permite autenticación interactiva en automatización.")
          data = json.loads(key)
          for field in ("client_email", "private_key", "project_id"):
              if not data.get(field):
                  raise SystemExit(f"Credencial GEE inválida: falta {field}.")
          print("Credencial Earth Engine: estructura válida")
          PY

      - name: Ejecutar ingesta completa (2001-2024, ~1.880 celdas)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingesta_alto_xingu.py

      - name: Control de calidad estricto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NORA_REGION_ID: alto_xingu
          NORA_DATA_SOURCE: nora_ingesta_alto_xingu
          NORA_EXPECTED_CELLS: "1880"
          NORA_START_YEAR: "2001"
          NORA_END_YEAR: "2024"
        run: python quality_check_nora.py

      - name: Publicar informe de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nora-quality-alto-xingu
          path: nora_quality_report.json

      - name: Resumen éxito
        if: success()
        run: |
          echo "Ingesta y quality gate completados correctamente."
          echo "Datos: Supabase nora_ingesta_alto_xingu"
          echo "El checkpoint permite reanudar sin duplicar filas."

      - name: Diagnóstico de fallo
        if: failure()
        run: |
          echo "NORA quedó detenido de forma segura: ingesta o quality gate falló."
          echo "No se ejecuta downstream discovery tras un fallo de calidad."
