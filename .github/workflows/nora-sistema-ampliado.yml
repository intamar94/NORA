name: NORA - Sistema Tierra ampliado

on:
  push:
    branches: [main]
    paths:
      - "ingesta_sistema_ampliado.py"
      - ".github/workflows/nora-sistema-ampliado.yml"
  workflow_dispatch:
    inputs:
      region_id:
        description: "Región registrada en Supabase"
        required: true
        type: string
        default: "alto_xingu"
      start_year:
        description: "Año inicial"
        required: true
        type: string
        default: "2024"
      end_year:
        description: "Año final"
        required: true
        type: string
        default: "2024"
      profile:
        description: "core = prueba estable; full = máximo panorama"
        required: true
        type: choice
        options:
          - core
          - full
        default: core

permissions:
  contents: read

jobs:
  validate:
    name: Validar configuración
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api pandas numpy supabase

      - name: Compilar ingesta
        run: python -m py_compile ingesta_sistema_ampliado.py

      - name: Validar secretos requeridos
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$GEE_SERVICE_ACCOUNT_KEY" || { echo "ERROR: falta GEE_SERVICE_ACCOUNT_KEY"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "ERROR: falta SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "ERROR: falta SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          python - <<'PY'
          import json, os
          data = json.loads(os.environ["GEE_SERVICE_ACCOUNT_KEY"])
          for field in ("client_email", "private_key", "project_id"):
              if not data.get(field):
                  raise SystemExit(f"ERROR: GEE_SERVICE_ACCOUNT_KEY no contiene {field}")
          print("OK: secretos presentes y JSON de GEE válido")
          PY

  smoke:
    name: Smoke test Earth Engine + Supabase
    needs: validate
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      GEE_PROJECT_ID: nora-506511
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NORA_REGION_ID: alto_xingu
      NORA_START_YEAR: "2024"
      NORA_END_YEAR: "2024"
      NORA_PROFILE: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api pandas numpy supabase

      - name: Ejecutar smoke test de una sola mensualidad
        run: |
          export NORA_START_YEAR=2024
          export NORA_END_YEAR=2024
          python - <<'PY'
          import os
          import runpy
          # El script principal procesa 12 meses; el smoke test limita la ejecución
          # temporalmente para validar autenticación, Earth Engine y Supabase.
          os.environ["NORA_START_YEAR"] = "2024"
          os.environ["NORA_END_YEAR"] = "2024"
          os.environ["NORA_SMOKE_MONTH"] = "1"
          runpy.run_path("ingesta_sistema_ampliado.py", run_name="__main__")
          PY

  ingest:
    name: Ejecutar ingesta solicitada
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      GEE_PROJECT_ID: nora-506511
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NORA_REGION_ID: ${{ inputs.region_id }}
      NORA_START_YEAR: ${{ inputs.start_year }}
      NORA_END_YEAR: ${{ inputs.end_year }}
      NORA_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api pandas numpy supabase

      - name: Ejecutar ingesta
        run: python ingesta_sistema_ampliado.py

      - name: Resumen
        if: success()
        run: echo "NORA: ingesta multidominio completada correctamente."
