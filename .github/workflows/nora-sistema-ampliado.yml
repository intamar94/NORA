name: NORA - Sistema Tierra ampliado

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nora-sistema-ampliado.yml"
      - "ingesta_sistema_ampliado.py"
  workflow_dispatch: {}

jobs:
  test_ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api pandas numpy supabase

      - name: Ejecutar prueba ampliada (1 mes, perfil core)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT_ID: nora-506511
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NORA_REGION_ID: alto_xingu
          NORA_START_YEAR: "2024"
          NORA_END_YEAR: "2024"
          NORA_PROFILE: core
          NORA_SMOKE_MONTH: "1"
        run: python ingesta_sistema_ampliado.py

      - name: Resumen
        if: success()
        run: |
          echo "NORA: prueba ampliada completada."
          echo "Región: Alto Xingu"
          echo "Periodo: enero 2024"
          echo "Perfil: core"

      - name: Error en prueba
        if: failure()
        run: |
          echo "NORA: la prueba ampliada falló. Revisar el log anterior."
          exit 1
