name: NORA - Sistema Tierra ampliado

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Prueba NORA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api pandas numpy supabase

      - name: Validar script
        run: python -m py_compile ingesta_sistema_ampliado.py

      - name: Ejecutar prueba mensual
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT_ID: nora-506511
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NORA_REGION_ID: alto_xingu
          NORA_START_YEAR: '2024'
          NORA_END_YEAR: '2024'
          NORA_PROFILE: core
          NORA_SMOKE_MONTH: '1'
        run: python ingesta_sistema_ampliado.py

      - name: Resultado
        if: success()
        run: echo 'NORA: prueba mensual completada correctamente.'